<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu</title>
  <!-- Inline, so browsers never request /favicon.ico (CloudFront serves menus/* and site/* only). -->
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
      --ground: #fafaf8; --text: #1c1c1a; --muted: #6a6a64; --line: #deded8;
      --ok: #1f6b45; --wrong: #b3261e; --offline: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #171716; --text: #ecece8; --muted: #a3a39c; --line: #33332f;
        --ok: #6fcf9c; --wrong: #ff8a80; --offline: #e6b450;
      }
    }
    body { margin: 0 auto; max-width: 560px; padding: 24px 16px 48px; background: var(--ground); color: var(--text);
           font: 16px/1.5 system-ui, sans-serif; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 28px 0 4px; }
    #status { margin: 0; font-weight: 600; min-height: 1.5em; }
    #status.ok { color: var(--ok); }
    #status.wrong { color: var(--wrong); }
    #status.offline { color: var(--offline); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-top: 1px solid var(--line); }
    li.wrong b { color: var(--wrong); }
    b { font-variant-numeric: tabular-nums; white-space: nowrap; }
    s { color: var(--muted); white-space: nowrap; }
    em { color: var(--ok); font-style: normal; font-size: .85rem; white-space: nowrap; }
  </style>
</head>
<body>
  <h1 id="title">Menu</h1>
  <p id="status" role="status"></p>
  <main id="menus"></main>
  <script type="module" src="/site/app.js"></script>
</body>
</html>
